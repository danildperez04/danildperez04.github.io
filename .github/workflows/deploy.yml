name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

# Acciones fijadas a un SHA (con su versión en el comentario): una etiqueta puede moverse.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build con Astro
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24
          package-manager: pnpm@12.6.0

  deploy:
    name: Deploy a GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
